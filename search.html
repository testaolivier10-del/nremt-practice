<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("nremt_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="theme-color" content="#16332E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — LevlPrep</title>
<meta name="description" content="Search across the study notes, glossary, mnemonics, flowcharts, and skills guide on this site.">
<meta property="og:site_name" content="LevlPrep">
<link rel="stylesheet" href="assets/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>

  #searchBox{
    width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:var(--radius);
    font-family:var(--font-ui);font-weight:700;font-size:15.5px;background:var(--white);color:var(--ink);margin-bottom:6px;
  }
  #searchBox:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-status{font:700 12.5px var(--font-mono);color:var(--muted);margin-bottom:20px;}

  .result{
    display:block;background:var(--white);border:2px solid var(--line);border-radius:16px;box-shadow:var(--lift-sm);
    padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;
    transition:transform .08s ease, box-shadow .08s ease, border-color .12s ease;
  }
  .result:hover{border-color:var(--accent);transform:translateY(1px);box-shadow:0 2px 0 var(--line);}
  .result-page{
    font-family:var(--font-ui);font-weight:800;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--accent);margin-bottom:4px;
  }
  .result-heading{font-weight:900;font-size:15px;margin-bottom:4px;}
  .result-snippet{font-size:13.5px;font-weight:600;color:var(--muted);}
  .result-snippet mark{background:#FDE9A0;color:inherit;border-radius:2px;}
  :root[data-theme="dark"] .result-snippet mark{background:#6b5a1f;}
  .empty-note{font-size:14px;font-weight:700;color:var(--muted);}

  .practice-cta{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between;
    background:var(--tint-accent);border:2px solid var(--accent);border-radius:16px;
    padding:16px 18px;margin-bottom:16px;
  }
  .practice-cta .t{font-weight:800;font-size:14px;color:var(--ink);}
  .practice-cta .t b{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:3px;}

</style>
</head>
<body>
  <div id="site-header"></div>
  <noscript><div class="site-nav-fallback" style="max-width:1120px;margin:0 auto;padding:14px clamp(20px,4vw,56px)"><a href="index.html">Home</a> · <a href="practice.html">Practice</a> · <a href="study-plan.html">Study Plan</a> · <a href="study-notes.html">Notes</a> · <a href="mnemonics.html">Mnemonics</a> · <a href="glossary.html">Glossary</a> · <a href="tools.html">Tools</a> · <a href="dashboard.html">Dashboard</a></div></noscript>
<div class="wrap">
  <div class="eyebrow">Tools</div>
  <h1>Search</h1>
  <p class="lede">Search across study notes, the glossary, mnemonics, flow diagrams, scenarios, and the skills guide.</p>

  <input type="search" id="searchBox" placeholder="Search this site… (e.g. &quot;OPQRST&quot;, &quot;tension pneumothorax&quot;)" autocomplete="off">
  <div class="search-status" id="searchStatus">Building search index…</div>
  <div id="results"></div>

  <footer>
    <p>Search runs entirely in your browser against this site's own pages — nothing is sent anywhere.</p>
  </footer>
</div>

<script>
  const PAGES = [
    { file: 'study-notes.html', title: 'Study Notes' },
    { file: 'glossary.html', title: 'Glossary' },
    { file: 'mnemonics.html', title: 'Mnemonics' },
    { file: 'flowcharts.html', title: 'Flow Diagrams' },
    { file: 'skillsheets.html', title: 'Skills Guide' },
    { file: 'scenario-sim.html', title: 'Scenarios' },
    { file: 'study-plan.html', title: 'Study Plan' },
  ];

  let INDEX = [];
  const statusEl = document.getElementById('searchStatus');
  const resultsEl = document.getElementById('results');
  const searchBox = document.getElementById('searchBox');

  // The 1,078-question bank in practice.html is 1.6MB inline and not something
  // worth indexing client-side here. Instead, when a query looks like it's
  // about one of the six exam domains, surface a direct deep link into
  // practice.html's existing ?domain= filter (the same param the homepage's
  // domain-path nodes and the dashboard's weak-domain links use).
  const DOMAIN_KEYWORDS = [
    { domain: 'Assessment', words: ['assessment','scene size-up','size-up','primary survey','secondary survey','vitals','opqrst','sample history'] },
    { domain: 'Airway & Respiratory', words: ['airway','respiratory','breathing','ventilation','oxygen','copd','asthma','pneumothorax','intubation','bvm'] },
    { domain: 'Cardiac & Medical', words: ['cardiac','medical','chest pain','arrest','stroke','diabetic','diabetes','seizure','overdose','allergic','anaphylaxis','mi ','myocardial'] },
    { domain: 'Trauma', words: ['trauma','bleeding','hemorrhage','shock','fracture','wound','burn','head injury','spinal'] },
    { domain: 'OB/Peds & Special Populations', words: ['ob/peds','pediatric','peds','obstetric','pregnan','delivery','newborn','geriatric','special population'] },
    { domain: 'EMS Operations', words: ['ems operations','operations','mci','mass casualty','triage','documentation','ambulance safety','hazmat'] },
  ];
  function matchDomain(q){
    const ql = q.toLowerCase();
    for(const d of DOMAIN_KEYWORDS){
      if(d.words.some(w => ql.includes(w))) return d.domain;
    }
    return null;
  }
  function renderPracticeCta(q){
    const domain = matchDomain(q);
    if(!domain){ document.getElementById('practiceCta')?.remove(); return; }
    let cta = document.getElementById('practiceCta');
    if(!cta){
      cta = document.createElement('div');
      cta.id = 'practiceCta';
      cta.className = 'practice-cta';
      resultsEl.before(cta);
    }
    cta.innerHTML = `
      <span class="t"><b>Question bank</b>Practice ${escapeHtml(domain)} questions from the 1,078-question bank</span>
      <a href="practice.html?domain=${encodeURIComponent(domain)}" class="btn-press alt sm">Practice this in the question bank &rarr;</a>
    `;
  }

  function extractChunks(doc, page){
    const chunks = [];
    let heading = page.title;
    const nodes = doc.body.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,td,summary');
    nodes.forEach(el => {
      const tag = el.tagName.toLowerCase();
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if(!text) return;
      if(/^h[1-4]$/.test(tag)){
        heading = text;
        return;
      }
      if(text.length < 12) return;
      chunks.push({ page: page.title, file: page.file, heading, text });
    });
    return chunks;
  }

  async function buildIndex(){
    const results = await Promise.allSettled(PAGES.map(async page => {
      const res = await fetch(page.file);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style').forEach(n => n.remove());
      return extractChunks(doc, page);
    }));
    results.forEach(r => { if(r.status === 'fulfilled') INDEX = INDEX.concat(r.value); });
    statusEl.textContent = INDEX.length
      ? `Indexed ${INDEX.length} sections across ${PAGES.length} pages. Type to search.`
      : 'Could not build a search index right now — try again after the page finishes loading.';
    if(searchBox.value.trim()) runSearch(searchBox.value.trim());
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, q){
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return escapeHtml(text.slice(0, 160));
    const start = Math.max(0, idx - 60);
    const end = Math.min(text.length, idx + q.length + 100);
    let snippet = text.slice(start, end);
    if(start > 0) snippet = '… ' + snippet;
    if(end < text.length) snippet = snippet + ' …';
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return escapeHtml(snippet).replace(re, '<mark>$1</mark>');
  }

  function runSearch(q){
    if(!q){ resultsEl.innerHTML = ''; document.getElementById('practiceCta')?.remove(); return; }
    renderPracticeCta(q);
    const ql = q.toLowerCase();
    const scored = INDEX
      .map(c => {
        const hIdx = c.heading.toLowerCase().indexOf(ql);
        const tIdx = c.text.toLowerCase().indexOf(ql);
        if(hIdx === -1 && tIdx === -1) return null;
        const score = (hIdx !== -1 ? 2 : 0) + (tIdx !== -1 ? 1 : 0);
        return { ...c, score };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score)
      .slice(0, 40);

    if(scored.length === 0){
      resultsEl.innerHTML = `<p class="empty-note">No results for "${escapeHtml(q)}".</p>`;
      return;
    }
    resultsEl.innerHTML = scored.map(c => {
      const href = c.file + '#:~:text=' + encodeURIComponent(q);
      return `
        <a class="result" href="${href}">
          <div class="result-page">${escapeHtml(c.page)}</div>
          <div class="result-heading">${escapeHtml(c.heading)}</div>
          <div class="result-snippet">${highlight(c.text, q)}</div>
        </a>
      `;
    }).join('');
  }

  let debounceTimer;
  searchBox.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => runSearch(searchBox.value.trim()), 120);
  });

  const params = new URLSearchParams(location.search);
  if(params.get('q')) searchBox.value = params.get('q');

  buildIndex();
</script>
<script src="assets/nav.js" defer></script>
</body>
</html>
